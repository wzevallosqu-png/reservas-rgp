<ion-content [fullscreen]="true">
  <div class="flex-center">
    <ion-card>
      <ion-card-header>
        <ion-card-title color="success">Iniciar Sesión</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="configurationForm">
          <ion-item>
            <ion-label position="floating">Correo Electrónico</ion-label>
            <ion-input type="email" formControlName="correoElectronico"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input type="password" formControlName="clave"></ion-input>
          </ion-item>
          <ion-button color="dark" fill="clear" size="full">Recuperar Correo Electrónico / Contraseña</ion-button>
          <ion-button color="success" size="full" (click)="iniciarSesion()">Entrar</ion-button>
          <ion-button color="success" fill="clear" size="full" (click)="registrarse()">Registrarse</ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
